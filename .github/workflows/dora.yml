name: DORA metrics

# Computes the four DORA metrics from this repository's real deployment
# history and publishes them to the Pages root, where all three environments
# read the same file.
#
# Writing to gh-pages rather than to a source branch is deliberate: it keeps
# bot commits out of dev, qa, and main, and removes any chance of a
# deploy-triggers-metrics-triggers-deploy loop.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

permissions:
  contents: write
  deployments: read

jobs:
  compute:
    name: Compute and publish
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # dora.mjs uses only Node builtins and site.config.mjs, so there is
      # nothing to install.
      - name: Compute metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT: ${{ runner.temp }}/dora.json
        run: node scripts/dora.mjs

      - name: Check out the published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish metrics
        working-directory: gh-pages
        run: |
          mkdir -p data
          cp "${{ runner.temp }}/dora.json" data/dora.json

          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::Metrics unchanged since the last run."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dora.json
          git commit -m "chore(dora): refresh delivery metrics"

          for attempt in 1 2 3; do
            if git push origin HEAD:gh-pages; then exit 0; fi
            echo "Push rejected (attempt ${attempt}). Rebasing."
            git pull --rebase origin gh-pages
          done
          echo "Could not push metrics after 3 attempts." >&2
          exit 1

      - name: Summary
        run: |
          {
            echo "### DORA metrics refreshed"
            echo ""
            echo '```json'
            cat "${{ runner.temp }}/dora.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
