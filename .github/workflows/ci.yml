name: CI

on:
  pull_request:
  push:
    branches: [dev, qa, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck

  build:
    name: Build ${{ matrix.env }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, qa, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          ENV_NAME: ${{ matrix.env }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.env }}
          path: dist/${{ matrix.env }}
          retention-days: 7

  verify:
    name: Verify links
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Re-uses the artifacts from the build job rather than rebuilding.
      # Each artifact unpacks to dist/<env>, which is what the checker expects.
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Check every internal link and asset reference
        run: node scripts/check-links.mjs
